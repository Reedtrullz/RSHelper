name: State Sync

on:
  push:
    branches:
      - main
    paths:
      - 'data/state/**'

permissions:
  contents: read

concurrency:
  group: rshelper-production
  cancel-in-progress: false

jobs:
  sync-state:
    name: Sync state to VPS (no deploy)
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Configure SSH key
        env:
          VPS_SSH_HOST_KEY: ${{ vars.VPS_SSH_HOST_KEY || secrets.VPS_SSH_HOST_KEY }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/id_rsa_racknerd
          chmod 600 ~/.ssh/id_rsa_racknerd

          normalize_host_keys() {
            sed -e 's/\r$//' -e '/^[[:space:]]*$/d' -e '/^[[:space:]]*#/d' | sort -u
          }

          expected_host_key="$(printf '%s\n' "${VPS_SSH_HOST_KEY:-}" | normalize_host_keys)"
          if [[ -z "$expected_host_key" ]]; then
            echo "VPS_SSH_HOST_KEY repository variable or secret must be set before state sync." >&2
            exit 1
          fi

          scanned_host_key="$(ssh-keyscan -T 10 -t ed25519 198.23.137.16 2>/dev/null | normalize_host_keys)"
          if [[ -z "$scanned_host_key" ]]; then
            echo "Unable to scan VPS SSH host key." >&2
            exit 1
          fi

          if [[ "$scanned_host_key" != "$expected_host_key" ]]; then
            echo "VPS SSH host key mismatch; refusing to update known_hosts." >&2
            exit 1
          fi

          printf '%s\n' "$expected_host_key" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_rsa_racknerd -o BatchMode=yes -o IdentitiesOnly=yes -o IdentityAgent=none -o StrictHostKeyChecking=yes deploy@198.23.137.16 'echo "SSH OK"'

      - name: Apply legacy feed through the verified running application
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$current" != "$GITHUB_SHA" ]]; then
            echo 'Obsolete state revision skipped.'
            exit 0
          fi
          stage=/tmp/rshelper-state-${{ github.run_id }}-${{ github.run_attempt }}
          ssh_args=(-i ~/.ssh/id_rsa_racknerd -o BatchMode=yes -o IdentitiesOnly=yes -o IdentityAgent=none -o StrictHostKeyChecking=yes)
          ssh "${ssh_args[@]}" deploy@198.23.137.16 "umask 077; mkdir '$stage'"
          scp -r "${ssh_args[@]}" data/state deploy@198.23.137.16:"$stage/source"
          ssh "${ssh_args[@]}" deploy@198.23.137.16 \
            "sudo -n chown -R 1000:1000 '$stage/source' && sudo -n find '$stage/source' -type d -exec chmod 700 {} + && sudo -n find '$stage/source' -type f -exec chmod 600 {} + && sudo -n python3 /opt/apps/rshelper/private-state.py --action legacy --stage '$stage/source'"

      - name: Clean only this run staging after success or failure
        if: always()
        run: |
          stage=/tmp/rshelper-state-${{ github.run_id }}-${{ github.run_attempt }}
          ssh -i ~/.ssh/id_rsa_racknerd -o BatchMode=yes -o IdentitiesOnly=yes -o IdentityAgent=none -o StrictHostKeyChecking=yes deploy@198.23.137.16 \
            "sudo -n rm -rf -- '$stage'"

      - name: Verify authenticated private state without exposing records
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_rsa_racknerd -o BatchMode=yes -o IdentitiesOnly=yes -o IdentityAgent=none -o StrictHostKeyChecking=yes deploy@198.23.137.16 \
            'sudo -n docker exec -i rshelper python -' < deploy/check_state.py
