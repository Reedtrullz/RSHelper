---
# Sync RSHelper tracked state to the VPS without an image deploy.
#
# Used by .github/workflows/state-sync.yml for state-only pushes, so a
# 15-minute trading-state update no longer rebuilds the image, restarts the
# container, or re-runs the whole production deploy. The merge step keeps
# site-side journal/position/watchlist writes (same merge rules as the full
# deploy playbook).
#
# Usage:
#   ansible-playbook -i deploy/inventory/hosts.yml deploy/playbook-state.yml

- name: Sync RSHelper tracked state to VPS
  hosts: rshelper
  become: true
  gather_facts: false

  vars:
    app_dir: /opt/apps/rshelper

  tasks:
    - name: Allocate one staging identity for this invocation
      ansible.builtin.set_fact:
        rollout_id: >-
          {{ lookup('pipe', 'python3 -c "import uuid; print(uuid.uuid4().hex)"') }}

    - name: Apply the legacy feed through the verified running application
      block:
        - name: Stage tracked state privately
          ansible.builtin.copy:
            src: "{{ playbook_dir }}/../data/state/"
            dest: "{{ app_dir }}/state-stage-{{ rollout_id }}/"
            owner: '1000'
            group: '1000'
            mode: '0600'
            directory_mode: '0700'

        - name: Apply with pinned image and shared host lease
          ansible.builtin.command:
            argv: [python3, "{{ app_dir }}/private-state.py", --action, legacy,
                   --stage, "{{ app_dir }}/state-stage-{{ rollout_id }}"]
          changed_when: true

      always:
        - name: Remove only this invocation staging directory
          ansible.builtin.file:
            path: "{{ app_dir }}/state-stage-{{ rollout_id }}"
            state: absent
