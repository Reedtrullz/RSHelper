---
# Playbook: deploy-rshelper.yml
# Description: Deploy RSHelper to the Racknerd VPS as a GHCR-backed Docker
#   container and expose it at rs.reidar.tech through host Caddy.
# Requirements:
#   - Target host has Docker, Docker Compose v2, and Caddy installed.
#   - Target host is logged into GHCR if the image is private.
#   - community.docker collection installed on the control node.
# Variables:
#   - docker_image: immutable image@sha256 digest to deploy
#   - app_version: full 40-character requested/baked source SHA
#     (default APP_VERSION env)
#   - app_domain: public domain (inventory default rs.reidar.tech)
# Usage:
#   APP_VERSION=$(git rev-parse HEAD) ansible-playbook \
#     -i deploy/inventory/hosts.yml deploy/playbook.yml \
#     -e "docker_image=ghcr.io/reedtrullz/rshelper@sha256:<registry-digest>"

- name: Deploy RSHelper to VPS
  hosts: rshelper
  become: true
  gather_facts: false

  vars:
    app_name: rshelper
    container_name: rshelper
    app_dir: /opt/apps/rshelper
    docker_image: ''
    app_version: "{{ lookup('ansible.builtin.env', 'APP_VERSION') }}"
    health_url: "http://{{ app_bind_address }}:{{ app_host_port }}/api/health"
    public_health_url: "https://{{ app_domain }}/api/health"
    caddy_marker_name: RSHelper
    rollback_image: "{{ app_name }}:rollback"
    state_stage: "{{ app_dir }}/state-stage-{{ rollout_id }}"

  pre_tasks:
    - name: Allocate one staging identity for this invocation
      ansible.builtin.set_fact:
        rollout_id: >-
          {{ lookup('pipe', 'python3 -c "import uuid; print(uuid.uuid4().hex)"') }}
      tags: [always]

    - name: Validate deployment variables
      ansible.builtin.assert:
        that:
          - app_domain is match('^[a-z0-9.-]+$')
          - app_host_port | int > 1024
          - app_host_port | int < 65536
          - app_bind_address in ['127.0.0.1', 'localhost']
          - docker_image is match('^ghcr.io/[a-z0-9._-]+/[a-z0-9._-]+@sha256:[0-9a-f]{64}$')
          - app_version is match('^[0-9a-f]{40}$')
        fail_msg: >-
          Invalid RSHelper deployment variables. Production deploys require
          an immutable GHCR digest and a full source revision. Tags and
          runtime VERSION cannot certify the bytes in the running image.
        success_msg: RSHelper deployment variables validated.
      tags: [always]

    - name: Verify Docker is available on target host
      ansible.builtin.command: docker --version
      register: docker_version
      changed_when: false
      check_mode: false
      tags: [always]

    - name: Verify Docker Compose is available on target host
      ansible.builtin.command: docker compose version
      register: compose_version
      changed_when: false
      check_mode: false
      tags: [always]

    - name: Verify Caddy is available on target host
      ansible.builtin.command: caddy version
      register: caddy_version
      changed_when: false
      check_mode: false
      tags: [always]

  tasks:
    - name: Ensure app directory exists
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        owner: deploy
        group: deploy
        mode: '0755'
      tags: [deploy]

    - name: Ensure RSHelper state volume exists with container ownership
      ansible.builtin.file:
        path: "{{ app_dir }}/data"
        state: directory
        owner: '1000'
        group: '1000'
        mode: '0755'
      tags: [deploy]

    - name: Capture current RSHelper container before deploy
      community.docker.docker_container_info:
        name: "{{ container_name }}"
      register: current_container
      check_mode: false
      tags: [deploy, rollback]

    - name: Install artifact verification helpers
      ansible.builtin.copy:
        src: "{{ item.source }}"
        dest: "{{ app_dir }}/{{ item.destination }}"
        owner: deploy
        group: deploy
        mode: '0644'
      loop:
        - {source: "{{ playbook_dir }}/../src/rshelper/release.py", destination: release-validation.py}
        - {source: "{{ playbook_dir }}/verify_artifact.py", destination: verify-artifact.py}
        - {source: "{{ playbook_dir }}/private_state.py", destination: private-state.py}
        - {source: "{{ playbook_dir }}/state_contract.py", destination: state-contract.py}
      tags: [deploy, rollback]

    - name: Capture previous immutable digest and OCI revision
      ansible.builtin.command:
        argv:
          - python3
          - "{{ app_dir }}/verify-artifact.py"
          - --mode
          - previous
          - --image
          - "{{ current_container.container.Image }}"
          - --repository
          - "{{ docker_image.split('@')[0] }}"
          - --container
          - "{{ container_name }}"
          - --validation-module
          - "{{ app_dir }}/release-validation.py"
      register: previous_receipt
      when: current_container.exists | default(false)
      changed_when: false
      tags: [deploy, rollback]

    - name: Read previous local health for legacy rollback compatibility
      ansible.builtin.uri:
        url: "{{ health_url }}"
        return_content: true
        timeout: 5
      register: previous_health
      when: current_container.exists | default(false)
      failed_when: false
      tags: [deploy, rollback]

    - name: Require observed runtime settings before a replacement
      ansible.builtin.assert:
        that:
          - current_container.container.HostConfig is mapping
          - "['ReadonlyRootfs', 'CapDrop', 'CapAdd', 'SecurityOpt', 'Memory', 'MemorySwap', 'PidsLimit'] | difference(current_container.container.HostConfig.keys() | list) | length == 0"
        fail_msg: Previous runtime settings are unavailable; retain the current container.
      when: current_container.exists | default(false)
      tags: [deploy, rollback]

    - name: Remember previous deployment for rollback
      ansible.builtin.set_fact:
        previous_container_exists: "{{ current_container.exists | default(false) }}"
        previous_image_id: "{{ current_container.container.Image | default('') }}"
        previous_app_version: "{{ (previous_receipt.stdout | default('{}') | from_json).revision | default('unknown') }}"
        previous_immutable_image: "{{ (previous_receipt.stdout | default('{}') | from_json).image | default('') }}"
        previous_image_digest: "{{ (previous_receipt.stdout | default('{}') | from_json).digest | default('') }}"
        previous_has_baked_metadata: "{{ (previous_health.json.build_revision | default('')) is match('^[0-9a-f]{40}$') }}"
        previous_runtime: "{{ current_container.container.HostConfig | default({}) }}"
        candidate_replacement_started: false
      tags: [deploy, rollback]

    - name: Tag previous image for rollback
      ansible.builtin.command:
        argv:
          - docker
          - tag
          - "{{ previous_image_id }}"
          - "{{ rollback_image }}"
      when:
        - previous_container_exists | bool
        - previous_image_id | length > 0
      changed_when: true
      check_mode: false
      tags: [deploy, rollback]

    - name: Deploy candidate image and verify exact public version
      block:
        - name: Authenticate to GHCR for the image pull
          ansible.builtin.command:
            argv:
              - docker
              - login
              - ghcr.io
              - -u
              - "{{ lookup('env', 'GHCR_USERNAME', default='') }}"
              - --password-stdin
            stdin: "{{ lookup('env', 'GHCR_TOKEN', default='') }}"
          no_log: true
          when: lookup('env', 'GHCR_TOKEN', default='') | length > 0
          changed_when: true
          tags: [deploy]

        - name: Pull requested GHCR image
          ansible.builtin.command:
            argv: [docker, pull, --platform, linux/amd64, "{{ docker_image }}"]
          changed_when: true
          tags: [deploy]

        - name: Verify candidate digest platform OCI label and baked revision before replacement
          ansible.builtin.command:
            argv:
              - python3
              - "{{ app_dir }}/verify-artifact.py"
              - --mode
              - candidate
              - --image
              - "{{ docker_image }}"
              - --revision
              - "{{ app_version }}"
              - --validation-module
              - "{{ app_dir }}/release-validation.py"
          register: candidate_receipt
          changed_when: false
          tags: [deploy]

        - name: Remember verified candidate identity
          ansible.builtin.set_fact:
            candidate_image_id: "{{ (candidate_receipt.stdout | from_json).image_id }}"
            candidate_image_digest: "{{ (candidate_receipt.stdout | from_json).digest }}"
          tags: [deploy]

        - name: Check for tracked state directory
          ansible.builtin.stat:
            path: "{{ playbook_dir }}/../data/state"
          register: tracked_state
          delegate_to: localhost
          become: false
          tags: [deploy]

        - name: Inspect explicit private profile activation
          ansible.builtin.stat:
            path: "{{ app_dir }}/data/.config/rshelper/identity-activation.json"
          register: private_activation
          tags: [deploy]

        - name: Fail if tracked state is missing on a production deploy
          ansible.builtin.fail:
            msg: >-
              data/state is absent from the checkout — the live site would
              serve stale/empty journal/positions/watchlist. Run the
              state-sync agent (or scripts/sync-state.sh) before deploying.
          when: not (tracked_state.stat.exists | bool) and not private_activation.stat.exists
          tags: [deploy]

        - name: Verify initialized private state with the running compatible artifact
          ansible.builtin.command:
            argv: [python3, "{{ app_dir }}/private-state.py", --action, contract,
                   --destination, "{{ app_dir }}"]
          when: private_activation.stat.exists
          changed_when: false
          tags: [deploy]

        - name: Verify candidate accepts the current private state contract
          ansible.builtin.command:
            argv: [flock, --exclusive, "{{ app_dir }}/production.lock", docker, run,
                   --rm, --name, "rshelper-state-check-{{ rollout_id }}", --network, none,
                   --read-only, --cap-drop, ALL, --security-opt, 'no-new-privileges:true',
                   --memory, 2g, --memory-swap, 2g, --pids-limit, '128', --user, '1000:1000', --mount,
                   "type=bind,src={{ app_dir }}/data,dst=/home/rshelper", --mount,
                   "type=bind,src={{ app_dir }}/state-contract.py,dst=/state-contract.py,readonly", --entrypoint,
                   python, "{{ candidate_image_id }}", /state-contract.py]
          when: private_activation.stat.exists
          changed_when: false
          tags: [deploy]

        - name: Stage tracked state for merge
          ansible.builtin.copy:
            src: "{{ playbook_dir }}/../data/state/"
            dest: "{{ state_stage }}/"
            owner: '1000'
            group: '1000'
            mode: '0600'
            directory_mode: '0700'
          when: not private_activation.stat.exists
          tags: [deploy]

        - name: Merge legacy seed through the verified candidate image under host lease
          ansible.builtin.command:
            argv:
              - flock
              - --exclusive
              - "{{ app_dir }}/production.lock"
              - docker
              - run
              - --rm
              - --name
              - "rshelper-state-seed-{{ rollout_id }}"
              - --network
              - none
              - --read-only
              - --cap-drop
              - ALL
              - --security-opt
              - no-new-privileges:true
              - --memory
              - 2g
              - --memory-swap
              - 2g
              - --pids-limit
              - '128'
              - --user
              - '1000:1000'
              - --mount
              - "type=bind,src={{ app_dir }}/data,dst=/home/rshelper"
              - --mount
              - "type=bind,src={{ state_stage }},dst=/state-stage,readonly"
              - --entrypoint
              - python
              - "{{ candidate_image_id }}"
              - /app/deploy/merge_state.py
              - /state-stage
              - /home/rshelper/.config/rshelper
              - --application
          when: not private_activation.stat.exists
          changed_when: true
          tags: [deploy]

        - name: Mark candidate replacement boundary
          ansible.builtin.set_fact:
            candidate_replacement_started: true
          tags: [deploy]

        - name: Render production Compose file
          ansible.builtin.template:
            src: templates/compose.production.yml.j2
            dest: "{{ app_dir }}/compose.production.yml"
            owner: deploy
            group: deploy
            mode: '0644'
          tags: [deploy]

        - name: Start RSHelper with Docker Compose
          ansible.builtin.command:
            argv: [flock, --exclusive, "{{ app_dir }}/production.lock", docker, compose,
                   --project-directory, "{{ app_dir }}", -f, "{{ app_dir }}/compose.production.yml",
                   up, --detach, --force-recreate, --remove-orphans, --wait, --wait-timeout, '120']
          changed_when: true
          tags: [deploy]

        - name: Verify running container uses the inspected candidate image ID
          ansible.builtin.command:
            argv:
              - python3
              - "{{ app_dir }}/verify-artifact.py"
              - --mode
              - running
              - --image
              - "{{ docker_image }}"
              - --revision
              - "{{ app_version }}"
              - --container
              - "{{ container_name }}"
              - --expected-image-id
              - "{{ candidate_image_id }}"
              - --runtime-constraints
              - --validation-module
              - "{{ app_dir }}/release-validation.py"
          changed_when: false
          tags: [verify]

        - name: Wait for local RSHelper health endpoint
          ansible.builtin.uri:
            url: "{{ health_url }}"
            return_content: true
            status_code: 200
            timeout: 5
          register: local_health
          until: >-
            local_health.status == 200
            and (local_health.json.status | default('')) == 'healthy'
            and (local_health.json.version | default('')) == app_version
            and (local_health.json.build_revision | default('')) == app_version
            and (local_health.json.image_digest | default('')) == candidate_image_digest
          retries: 12
          delay: 5
          failed_when: false
          tags: [verify]

        - name: Fail if local health endpoint is not healthy
          ansible.builtin.fail:
            msg: "Local health check failed for {{ health_url }}: {{ local_health }}"
          when: >-
            local_health.status | default(0) != 200
            or (local_health.json.status | default('')) != 'healthy'
            or (local_health.json.version | default('')) != app_version
            or (local_health.json.build_revision | default('')) != app_version
            or (local_health.json.image_digest | default('')) != candidate_image_digest
          tags: [verify]

        - name: Manage Caddy reverse proxy block
          ansible.builtin.blockinfile:
            path: /etc/caddy/Caddyfile
            marker: "# {mark} ANSIBLE MANAGED - {{ caddy_marker_name }}"
            block: |
              {{ app_domain }} {
                reverse_proxy {{ app_bind_address }}:{{ app_host_port }} {
                  header_up X-Real-IP {remote_host}
                  header_up X-Forwarded-For {remote_host}
                }
              }
            backup: true
            mode: '0644'
            validate: caddy validate --config %s --adapter caddyfile
          notify: Reload Caddy
          tags: [caddy]

        - name: Validate Caddy configuration
          ansible.builtin.command: caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          changed_when: false
          tags: [caddy, verify]

        - name: Apply Caddy configuration before public verification
          ansible.builtin.meta: flush_handlers
          tags: [caddy]

        - name: Verify public deployment version
          ansible.builtin.uri:
            url: "{{ public_health_url }}"
            return_content: true
            status_code: 200
            timeout: 10
          register: public_health
          until: >-
            public_health.status == 200
            and (public_health.json.status | default('')) == 'healthy'
            and (public_health.json.version | default('')) == app_version
            and (public_health.json.build_revision | default('')) == app_version
            and (public_health.json.image_digest | default('')) == candidate_image_digest
          retries: 12
          delay: 5
          failed_when: false
          delegate_to: localhost
          become: false
          tags: [verify]

        - name: Fail if public deployment version is not healthy
          ansible.builtin.fail:
            msg: "Public health check failed for {{ public_health_url }}: {{ public_health }}"
          when: >-
            public_health.status | default(0) != 200
            or (public_health.json.status | default('')) != 'healthy'
            or (public_health.json.version | default('')) != app_version
            or (public_health.json.build_revision | default('')) != app_version
            or (public_health.json.image_digest | default('')) != candidate_image_digest
          tags: [verify]

        - name: Report successful deployment
          ansible.builtin.debug:
            msg:
              - "RSHelper deployed at {{ public_health_url }}"
              - "Container: {{ container_name }}"
              - "Image: {{ docker_image }}"
              - "Version: {{ app_version }}"
          tags: [verify]

      rescue:
        - name: Fail preflight without replacing a running container
          ansible.builtin.fail:
            msg: "Candidate artifact preflight failed before container replacement; existing service retained."
          when: not (candidate_replacement_started | bool)
          tags: [rollback]

        - name: Fail when rollback image is unavailable
          ansible.builtin.fail:
            msg: "Deployment failed and no previous image was available for rollback: {{ ansible_failed_result | default({}) }}"
          when: >-
            not (previous_container_exists | bool)
            or (previous_image_id | length == 0)
          tags: [rollback]

        - name: Report rollback start
          ansible.builtin.debug:
            msg:
              - "Candidate deployment failed; restoring previous digest {{ previous_immutable_image }}."
              - "Previous version: {{ previous_app_version }}"
              - "Failure: {{ ansible_failed_result | default({}) }}"
          tags: [rollback]

        - name: Verify rollback artifact accepts every acknowledged private ledger
          ansible.builtin.command:
            argv: [flock, --exclusive, "{{ app_dir }}/production.lock", docker, run,
                   --rm, --name, "rshelper-rollback-check-{{ rollout_id }}", --network, none,
                   --read-only, --cap-drop, ALL, --security-opt, 'no-new-privileges:true',
                   --memory, 2g, --memory-swap, 2g, --pids-limit, '128', --user, '1000:1000', --mount,
                   "type=bind,src={{ app_dir }}/data,dst=/home/rshelper", --mount,
                   "type=bind,src={{ app_dir }}/state-contract.py,dst=/state-contract.py,readonly", --entrypoint,
                   python, "{{ previous_image_id }}", /state-contract.py]
          when: private_activation.stat.exists
          changed_when: false
          tags: [rollback]

        - name: Render rollback Compose file
          ansible.builtin.template:
            src: templates/compose.production.yml.j2
            dest: "{{ app_dir }}/compose.production.yml"
            owner: deploy
            group: deploy
            mode: '0644'
          vars:
            compose_image: "{{ previous_immutable_image }}"
            compose_app_version: "{{ previous_app_version }}"
            compose_image_digest: "{{ previous_image_digest }}"
            compose_read_only: "{{ previous_runtime.ReadonlyRootfs | default(false) }}"
            compose_cap_drop: "{{ previous_runtime.CapDrop | default([], true) }}"
            compose_cap_add: "{{ previous_runtime.CapAdd | default([], true) }}"
            compose_security_opt: "{{ previous_runtime.SecurityOpt | default([], true) }}"
            compose_memory: "{{ previous_runtime.Memory | default(0) }}"
            compose_memory_swap: "{{ previous_runtime.MemorySwap | default(0) }}"
            compose_pids: "{{ previous_runtime.PidsLimit | default(-1, true) }}"
            compose_tmpfs: "{{ previous_runtime.Tmpfs | default({}, true) }}"
          tags: [rollback]

        - name: Restore previous RSHelper container
          ansible.builtin.command:
            argv: [flock, --exclusive, "{{ app_dir }}/production.lock", docker, compose,
                   --project-directory, "{{ app_dir }}", -f, "{{ app_dir }}/compose.production.yml",
                   up, --detach, --force-recreate, --remove-orphans, --wait, --wait-timeout, '120', --pull, never]
          changed_when: true
          tags: [rollback]

        - name: Verify restored image ID matches the recorded rollback artifact
          ansible.builtin.command:
            argv:
              - python3
              - "{{ app_dir }}/verify-artifact.py"
              - --mode
              - running
              - --image
              - "{{ previous_immutable_image }}"
              - --revision
              - "{{ previous_app_version }}"
              - --container
              - "{{ container_name }}"
              - --expected-image-id
              - "{{ previous_image_id }}"
              - --validation-module
              - "{{ app_dir }}/release-validation.py"
          changed_when: false
          tags: [rollback, verify]

        - name: Wait for local rollback health endpoint
          ansible.builtin.uri:
            url: "{{ health_url }}"
            return_content: true
            status_code: 200
            timeout: 5
          register: rollback_local_health
          until: >-
            rollback_local_health.status == 200
            and (rollback_local_health.json.status | default('')) == 'healthy'
            and (
              previous_app_version == 'unknown'
              or (rollback_local_health.json.version | default('')) == previous_app_version
            )
            and (not previous_has_baked_metadata | bool or (
              (rollback_local_health.json.build_revision | default('')) == previous_app_version
              and (rollback_local_health.json.image_digest | default('')) == previous_image_digest))
          retries: 12
          delay: 5
          failed_when: false
          tags: [rollback, verify]

        - name: Fail if rollback local health endpoint is not healthy
          ansible.builtin.fail:
            msg: "Rollback local health check failed for {{ health_url }}: {{ rollback_local_health }}"
          when: >-
            rollback_local_health.status | default(0) != 200
            or (rollback_local_health.json.status | default('')) != 'healthy'
            or (
              previous_app_version != 'unknown'
              and (rollback_local_health.json.version | default('')) != previous_app_version
            )
            or (previous_has_baked_metadata | bool and (
              (rollback_local_health.json.build_revision | default('')) != previous_app_version
              or (rollback_local_health.json.image_digest | default('')) != previous_image_digest))
          tags: [rollback, verify]

        - name: Verify public deployment version after rollback
          ansible.builtin.uri:
            url: "{{ public_health_url }}"
            return_content: true
            status_code: 200
            timeout: 10
          register: rollback_public_health
          until: >-
            rollback_public_health.status == 200
            and (rollback_public_health.json.status | default('')) == 'healthy'
            and (
              previous_app_version == 'unknown'
              or (rollback_public_health.json.version | default('')) == previous_app_version
            )
            and (not previous_has_baked_metadata | bool or (
              (rollback_public_health.json.build_revision | default('')) == previous_app_version
              and (rollback_public_health.json.image_digest | default('')) == previous_image_digest))
          retries: 12
          delay: 5
          failed_when: false
          delegate_to: localhost
          become: false
          tags: [rollback, verify]

        - name: Fail if rollback public health endpoint is not healthy
          ansible.builtin.fail:
            msg: "Rollback public health check failed for {{ public_health_url }}: {{ rollback_public_health }}"
          when: >-
            rollback_public_health.status | default(0) != 200
            or (rollback_public_health.json.status | default('')) != 'healthy'
            or (
              previous_app_version != 'unknown'
              and (rollback_public_health.json.version | default('')) != previous_app_version
            )
            or (previous_has_baked_metadata | bool and (
              (rollback_public_health.json.build_revision | default('')) != previous_app_version
              or (rollback_public_health.json.image_digest | default('')) != previous_image_digest))
          tags: [rollback, verify]

        - name: Fail deployment after successful rollback
          ansible.builtin.fail:
            msg: >-
              Candidate deployment failed and RSHelper was rolled back to
              previous digest {{ previous_immutable_image }} with version {{ previous_app_version }}.
          tags: [rollback]

      always:
        - name: Remove only owned interrupted state helper containers
          ansible.builtin.command:
            argv: [docker, rm, --force, "rshelper-state-seed-{{ rollout_id }}",
                   "rshelper-state-check-{{ rollout_id }}"]
          register: owned_container_cleanup
          failed_when: owned_container_cleanup.rc not in [0, 1]
          changed_when: owned_container_cleanup.rc == 0
          tags: [deploy, rollback]

        - name: Remove only this invocation staging directory
          ansible.builtin.file:
            path: "{{ state_stage }}"
            state: absent
          tags: [deploy, rollback]

  handlers:
    - name: Reload Caddy
      ansible.builtin.systemd:
        name: caddy
        state: reloaded
